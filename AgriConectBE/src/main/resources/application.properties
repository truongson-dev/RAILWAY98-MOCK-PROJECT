# ═══════════════════════════════════════════════════════════
# AgriConnect Backend — Cấu hình ứng dụng
# ═══════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────
server.port=8080
# Đường dẫn gốc của tất cả API
server.servlet.context-path=/

spring.application.name=AgriConectBE

# ── Database (MySQL) ────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/agriconnect_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ── JPA/Hibernate ────────────────────────────────────────────
# validate: Hibernate chỉ kiểm tra schema, không tự tạo/xóa bảng
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Tắt Open Session in View để tránh LazyInitializationException không mong muốn
spring.jpa.open-in-view=false

# -----------------------
# Naming entity mapping table in SQL
# -----------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -----------------------
# Pagable
# -----------------------
spring.data.web.pageable.default-page-size=5
spring.data.web.pageable.one-indexed-parameters=true
spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size
spring.data.web.sort.sort-parameter=sort

# ── Flyway (Database Migration) ──────────────────────────────
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ── JWT ──────────────────────────────────────────────────────
# Secret key dùng để ký JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=28800000
jwt.refresh-token-expiration=2592000000

# ── OAuth2 — Google Login ────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=YOUR_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=profile,email
app.oauth2.redirect-uri=http://localhost:3000/oauth2/callback

# ── Email (SMTP) ─────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=thanhsonpnv27@gmail.com
spring.mail.password=seydelhbsujvdtzb
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
app.mail.from=AgriConnect <thanhsonpnv27@gmail.com>

# ── File Upload ───────────────────────────────────────────────
app.upload.dir=uploads/
app.upload.base-url=http://localhost:8080/uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── OTP ───────────────────────────────────────────────────────
app.otp.expiration-minutes=10

# ── Swagger / OpenAPI ─────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ───────────────────────────────────────────────────
logging.level.com.vti=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
