# ═══════════════════════════════════════════════════════════
# AgriConnect Backend — Cấu hình ứng dụng
# ═══════════════════════════════════════════════════════════

# ── Server ──────────────────────────────────────────────────
server.port=8080
# Đường dẫn gốc của tất cả API
server.servlet.context-path=/

# ── Database (MySQL) ────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/agriconnect_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# ── JPA/Hibernate ────────────────────────────────────────────
# validate: Hibernate chỉ kiểm tra schema, không tự tạo/xóa bảng
# (Flyway sẽ quản lý schema thay vì Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Tắt Open Session in View để tránh LazyInitializationException không mong muốn
spring.jpa.open-in-view=false

# ── Flyway (Database Migration) ──────────────────────────────
# Flyway quản lý lịch sử thay đổi schema, đọc file từ db/migration/
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ── JWT ──────────────────────────────────────────────────────
# Secret key dùng để ký JWT (THAY BẰNG KEY THẬT KHI DEPLOY, ít nhất 32 ký tự)
jwt.secret=AgriConnect2026_SecretKey_MustBe256BitsLong_ChangeInProd!
# Access Token hết hạn sau 15 phút (đơn vị: milliseconds)
jwt.access-token-expiration=900000
# Refresh Token hết hạn sau 30 ngày (đơn vị: milliseconds)
jwt.refresh-token-expiration=2592000000

# ── OAuth2 — Google Login ────────────────────────────────────
# THAY CLIENT_ID và CLIENT_SECRET bằng giá trị thật từ Google Console
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Sau khi đăng nhập Google thành công, redirect đến FE với token
app.oauth2.redirect-uri=http://localhost:3000/oauth2/callback

# ── Email (SMTP) ─────────────────────────────────────────────
# Cấu hình gửi email xác thực và reset mật khẩu
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=thanhsonpnv27@gmail.com
# Dùng App Password của Gmail (không dùng mật khẩu thường)
spring.mail.password=seydelhbsujvdtzb
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
# Tên hiển thị khi gửi email
app.mail.from=AgriConnect <thanhsonpnv27@gmail.com>

# ── File Upload ───────────────────────────────────────────────
# Thư mục lưu ảnh sản phẩm và tài liệu KYC (local filesystem)
app.upload.dir=uploads/
# Đường dẫn URL trả về cho client để xem ảnh
app.upload.base-url=http://localhost:8080/uploads/
# Giới hạn kích thước file upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ── OTP ───────────────────────────────────────────────────────
# OTP xác thực email hết hạn sau 10 phút
app.otp.expiration-minutes=10

# ── Swagger / OpenAPI ─────────────────────────────────────────
# Truy cập tài liệu API tại: http://localhost:8080/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ── Logging ───────────────────────────────────────────────────
logging.level.com.vti=DEBUG
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN