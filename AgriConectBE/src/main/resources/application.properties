spring.application.name=AgriConectBE
# -----------------------
# Database
# -----------------------
spring.datasource.url=jdbc:mysql://localhost:3306/agriconnect_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Sondz2002@

# -----------------------
# Naming entity mapping table in SQL
# -----------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# -----------------------
# Show sql
# -----------------------
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
# -----------------------
# Pagable
# -----------------------
# Default page size
spring.data.web.pageable.default-page-size=5
# start page from 1 (instead of 0)
spring.data.web.pageable.one-indexed-parameters=true
# parameter name
# truyền vào số trang muốn hiển thị dữ liệu
spring.data.web.pageable.page-parameter=page
# truyền vào số bản ghi hiển thị trong một trang
spring.data.web.pageable.size-parameter=size
# sắp xếp dữ liệu theo chiều tăng dần hoặc giảm dần
spring.data.web.sort.sort-parameter=sort